# Config used only by `vale test --coverage`, never by the pre-commit hook
# or by `vale`/`vale-qdoc-linter` for real linting (that's .vale-qdoc.ini).
#
# Rule-level test sidecars (styles/Qt/**/*.test.yml) must exercise every Qt.*
# rule's actual matching logic, including rules .vale-qdoc.ini currently
# leaves disabled/commented out as experimental (see styles/Qt/Language/README.md
# and styles/Qt/Structure/README.md) -- a rule being off in production doesn't
# mean its test coverage should silently go missing. BasedOnStyles = Qt turns
# every Qt.* rule on regardless of .vale-qdoc.ini's individual toggles.
#
# Vocab is set to match .vale-qdoc.ini exactly (not omitted) so `vale test`
# exercises the same Vocab-interaction path real linting does -- this is what
# surfaced a real bug in Qt.Language.WordyConstructions (silently never fired
# under the real config; fixed by adding `vocab: false` to that rule).
StylesPath = styles
MinAlertLevel = suggestion
Vocab = Qt, qul, Figma

[*.{qdoc,qdocinc,cpp,qml,h,cxx}]
BasedOnStyles = Qt
