# Vale configuration for linting QDoc source files (.qdoc, .qdocinc, .qml, .cpp).
#
# NOTE: The IgnoredClasses, SkippedScopes, and IgnoredScopes settings below
# are placeholders from the HTML config and need to be adapted for QDoc sources.

# Core settings
StylesPath = styles
MinAlertLevel = suggestion #, warning or error

#A comma-separated list of CSS classes to ignore (HTML-specific — adapt for QDoc).
#IgnoredClasses = alignedsummary, fn, copy-notice, cpp, qml, footer, navigationbar, tblQmlPropNode

#A comma-separated list of HTML blocks to ignore (HTML-specific — adapt for QDoc).
#SkippedScopes = header, footer, script

#A comma-separated list of inline HTML elements to skip (HTML-specific — adapt for QDoc).
#IgnoredScopes = a,code,b

#Style packages from the github.com/errata-ai repo
#vale can sync these packages to ensure they are always
#up-to-date.
Packages = Microsoft

#Vocabulary containing the list of words that you either
#want to accept or reject. For more information about
#this, refer to: https://vale.sh/docs/topics/vocab/
Vocab = Qt, qul, Figma

[formats]
# Route .cpp through the QDoc fragment pipeline so that /*!...*/ doc-comment
# blocks get full QDoc-aware linting (heading/brief/title scopes and
# sentence rules). See lintQDocFragments in lint/fragment.go.
# Note: .qml is already mapped to QDoc() in GetLanguageFromExt and does not
# need a format association here.
cpp = qdoc
cxx = qdoc
h = qdoc

[*.{qdoc,qdocinc,cpp,qml,h,cxx}]
# Strip inline command tokens that would otherwise appear as prose.
# \c is NOT listed here: the upstream vale converts \c to <code>...</code> via
# qdocToHTML, and code spans are naturally skipped by the HTML walker. Listing
# \c in TokenIgnores would blank the argument (including any trailing period,
# e.g. "\c false.") before qdocToHTML runs, causing false positives where a
# brief ending in a \c-terminated sentence is reported as missing a period.
# \l is also NOT listed — it is a link_command converted to <a href=...> by
# qdocToHTML; the link text is linted correctly via the inline capture path.
# The final entry blanks qualified Qt module names (QtQuick.Layouts,
# QtQml.Models). Microsoft.Spacing matches [a-z][.?!][A-Z] and cannot
# tell the period in a module name from a sentence boundary, so it
# reports these as missing spaces. Keep the entry as narrow as
# possible: anything it blanks is invisible to every enabled rule,
# including Qt.Spelling.
TokenIgnores = \\meta[ \t]+.*, \\(?:snippet|include|quotefile|quotefromfile|codeline|printline|printto|printuntil|skipline|skipto|skipuntil|page|externalpage|example|headerfile|nextpage|previouspage|startpage|ingroup|annotatedlist|generatelist|nativetype|inqmlmodule|since|qtcmakepackage|qtvariable)[ \t]+\S+(?:[ \t]+\S+)?, Qt(?:Quick3D|Quick|Qml)(?:\.(?:Layouts|Controls|Material|Universal|Fusion|Imagine|iOS|Particles|Particles3D|Shapes|Timeline|Dialogs|LocalStorage|VirtualKeyboard|Settings|Scene2D|Scene3D|Models|XmlListModel|WorkerScript|Effects|Helpers))+
# Load all rules from the listed styles. Alternatively, enable individual
# rules below using Style.Rule = YES.
#BasedOnStyles = Microsoft, Qt

# Enable/disable each rule offered by the style
# Style.Rule = {YES, NO} to enable or disable a specific rule
Vale.Terms = YES
Vale.Avoid = YES
Microsoft.Foreign = YES
Microsoft.Avoid = YES
Microsoft.OxfordComma = YES
Microsoft.Passive = YES
Microsoft.Dashes = YES
Microsoft.Spacing = YES
Microsoft.Wordiness = YES
Microsoft.We = YES
Microsoft.HeadingAcronyms = YES
Microsoft.HeadingColons = YES
Microsoft.HeadingPunctuation = YES
Microsoft.Headings = YES
Microsoft.SentenceLength = YES
Microsoft.Semicolon = YES
Qt.FutureTense = YES
Qt.LatinTerms = YES
Qt.LoseLoose = YES
Qt.Repetition = YES
Qt.QDocBrief = YES
Qt.QDocPageTitle = YES
Qt.QDocImageAlt = YES
Qt.QDocImageAltInlineCmd = YES
Qt.QDocAnchorAPIName = YES
# Extends the built-in spell checker with additional filters
Qt.Spelling = YES
