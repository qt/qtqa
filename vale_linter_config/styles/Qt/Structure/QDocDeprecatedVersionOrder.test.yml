- name: flags a version bracket that follows the deprecated description
  format: qdoc
  input: |
    /*!
        \fn void QWidget::repaintLater()
        \deprecated Use update() instead. [6.5]
    */
  contains: Qt.Structure.QDocDeprecatedVersionOrder

- name: stays silent when the version bracket immediately follows the command
  format: qdoc
  input: |
    /*!
        \fn void QWidget::paintLater()
        \deprecated [6.5] Use update() instead.
    */
  absent:
    - Qt.Structure.QDocDeprecatedVersionOrder
