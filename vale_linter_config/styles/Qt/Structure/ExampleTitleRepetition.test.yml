- name: flags a title that repeats "Example"
  format: qdoc
  input: |
    /*!
        \page t.html
        \title Button Example
    */
  contains: Qt.Structure.ExampleTitleRepetition

- name: stays silent on a title without "Example"
  format: qdoc
  input: |
    /*!
        \page t.html
        \title Button Basics
    */
  absent:
    - Qt.Structure.ExampleTitleRepetition
