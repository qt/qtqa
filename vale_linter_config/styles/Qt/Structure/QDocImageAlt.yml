# scope: raw, not meta.noalt -- the converter marks an image `noalt` when
# nothing follows the file name on the same line, so alt text wrapped onto the
# next line, which QDoc accepts, was flagged. This rule matches an \image whose
# line holds only a file name and whose next line does not start with a brace.
# Alt text on the same line, with or without braces, never matches.
# \inlineimage is not checked here.
extends: existence
message: "Add alt text for image '%s'."
link: https://doc.qt.io/qt-6/qdoc-guide-writing.html
level: warning
scope: raw
# A raw multi-word match silently never fires when the sentence holds a Vocab
# accept-list term, so opt out of the Vocab.
vocab: false
raw:
  - '\\image[ \t]+\S+[ \t]*\r?\n(?![ \t]*\*?[ \t]*\{)'
